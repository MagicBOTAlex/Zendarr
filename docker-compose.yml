services:
  zendarr:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Release (default) or Debug. Debug enables the debug-only, anonymous
        # diagnostics dump: `CONFIGURATION=Debug docker compose up -d --build`.
        CONFIGURATION: ${CONFIGURATION:-Release}
    image: magicbotalex2/zendarr:${CONFIGURATION:-latest}
    container_name: zendarr
    restart: unless-stopped
    ports:
      # The one unified Zendarr listener: UI + both API domains
      # (selected per request by API key).
      - "${ZENDARR_PORT:-6868}:${ZENDARR_PORT:-6868}"
    environment:
      ZENDARR_DATA: /data
      ZENDARR_PORT: ${ZENDARR_PORT:-6868}
      # UID/GID the service runs as. The entrypoint starts as root, remaps the
      # `app` user to these ids and repairs the mounted volumes' ownership, then
      # drops to them before running the service, so the running process is
      # never root. Supplementary groups (e.g. `group_add` for /dev/dri) are
      # preserved.
      PUID: ${PUID:-1654}
      PGID: ${PGID:-1654}
      TZ: ${TZ:-UTC}
      # Set to 1/true/yes to disable the login page (no authentication). The
      # API-key auth (Prowlarr/Jellyseerr) is unaffected.
      ZENDARR_DISABLE_AUTH: ${ZENDARR_DISABLE_AUTH:-false}
      # Transcode working folder (large temp files). It lives in its own volume
      # below so it survives restarts; point it at another mounted path to move
      # it (e.g. a fast SSD).
      ZENDARR_TRANSCODE_TEMP_FOLDER: ${ZENDARR_TRANSCODE_TEMP_FOLDER:-/transcode}
    volumes:
      # Config, databases, logs and media metadata.
      - zendarr-data:/data
      # Transcode working folder, kept out of the config volume. To put it on a
      # specific host disk instead, replace with a bind mount:
      #   - /path/on/host/transcode:/transcode
      - zendarr-transcode:/transcode
    # Media compression (Settings -> Compression) uses the ffmpeg bundled in the
    # image. To expose GPUs to the container, uncomment the blocks below:
    #
    # NVIDIA (needs the NVIDIA Container Toolkit on the host + `--gpus` support):
    #   environment:
    #     NVIDIA_VISIBLE_DEVICES: all
    #     NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    #   deploy:
    #     resources:
    #       reservations:
    #         devices:
    #           - driver: nvidia
    #             count: all
    #             capabilities: [gpu, video]
    #
    # AMD iGPU VA-API (pass the render node through; the app vendor-matches it).
    # The image's `app` user is already a member of the host video/render groups
    # and the entrypoint preserves them, so no `group_add` is normally needed.
    # If the host uses different GIDs, add them explicitly:
    #   devices:
    #     - /dev/dri:/dev/dri
    #   group_add:
    #     - "44"    # video
    #     - "109"   # render (Debian)
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS "http://localhost:${ZENDARR_PORT:-6868}/ping" || exit 1
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

volumes:
  zendarr-data:
  zendarr-transcode:
